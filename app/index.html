<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Get CardFinder Live</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48.png" />
  <style>
    :root { --navy:#051b49; --orange:#ff7a00; --muted:#5b667a; }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: linear-gradient(135deg, #062b73 0%, #041a47 62%, #031335 100%);
      color: white; padding: 24px;
    }
    .card { max-width: 420px; width: 100%; text-align: center; }
    h1 { font-size: 30px; line-height: 1.1; margin: 0 0 10px; letter-spacing: -0.02em; }
    p { color: rgba(255,255,255,0.82); font-size: 16px; line-height: 1.5; margin: 0 0 22px; }
    .btn {
      display: block; text-decoration: none; border-radius: 16px; padding: 14px 20px;
      font-weight: 900; margin-top: 12px;
    }
    .btn small { display: block; font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.78; }
    .btn span { font-size: 16px; }
    .primary { background: linear-gradient(135deg, #ffffff 0%, #f7fbff 100%); color: var(--navy); }
    .secondary { background: rgba(255,255,255,0.09); color: white; border: 1px solid rgba(255,255,255,0.24); }
  </style>
  <script>
    (function () {
      var ua = navigator.userAgent || "";
      var appStore = "https://apps.apple.com/app/cardfinder-live/id6757400880";
      var googlePlay = "https://play.google.com/store/apps/details?id=com.cardfinderlive.runner";
      if (/iPhone|iPad|iPod/i.test(ua)) { window.location.replace(appStore); }
      else if (/Android/i.test(ua)) { window.location.replace(googlePlay); }
    })();
  </script>
</head>
<body>
  <main class="card">
    <h1>Get CardFinder Live</h1>
    <p>Pick your store and the download starts right away.</p>
    <a class="btn primary" href="https://apps.apple.com/app/cardfinder-live/id6757400880"><small>Download on the</small><span>App Store</span></a>
    <a class="btn secondary" href="https://play.google.com/store/apps/details?id=com.cardfinderlive.runner"><small>Get it on</small><span>Google Play</span></a>
  </main>
</body>
</html>
